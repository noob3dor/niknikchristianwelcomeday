<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Little Champion's Christening</title>
  <style>
    :root {
      --bg-color: #0b0c10;
      --card-bg: #1a1c23;
      --accent-color: #e22828; /* Racing Red */
      --secondary-accent: #f39c12; /* Trophy Gold */
      --text-color: #ffffff;
      --subtext-color: #c5c6c7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Impact', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(#1f2833 15%, transparent 16%),
        radial-gradient(#1f2833 15%, transparent 16%);
      background-size: 20px 20px;
      background-position: 0 0, 10px 10px;
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .invite-card {
      background: linear-gradient(135deg, #121317 0%, #1f232d 100%);
      border: 3px solid var(--accent-color);
      border-radius: 14px;
      padding: 30px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 0 25px rgba(226, 40, 40, 0.4), inset 0 0 15px rgba(0, 0, 0, 0.8);
      position: relative;
      overflow: hidden;
    }

    /* Checkered Flag Top Border */
    .invite-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 12px;
      background: 
        linear-gradient(45deg, #000 25%, transparent 25%), 
        linear-gradient(-45deg, #000 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #000 75%),
        linear-gradient(-45deg, transparent 75%, #000 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
      background-color: #fff;
    }

    .badge {
      display: inline-block;
      background: var(--accent-color);
      color: #fff;
      padding: 6px 16px;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: bold;
      margin-top: 10px;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
      transform: skew(-10deg);
      box-shadow: 2px 2px 0px #000;
    }

    h1 {
      font-size: 2.3rem;
      margin-bottom: 5px;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-style: italic;
      text-shadow: 2px 2px 0px var(--accent-color);
    }

    p.subtitle {
      font-family: 'Segoe UI', sans-serif;
      color: var(--subtext-color);
      margin-bottom: 20px;
      font-size: 0.95rem;
      font-weight: 500;
    }

    .event-details {
      background: #090a0c;
      border-left: 4px solid var(--secondary-accent);
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 25px;
      text-align: left;
    }

    .detail-item {
      margin-bottom: 8px;
      font-size: 0.95rem;
      font-family: 'Segoe UI', sans-serif;
    }

    .detail-item:last-child {
      margin-bottom: 0;
    }

    .detail-item strong {
      color: var(--secondary-accent);
      text-transform: uppercase;
    }

    .rsvp-form input, .rsvp-form select, .rsvp-form button {
      font-family: 'Segoe UI', sans-serif;
      width: 100%;
      padding: 14px;
      margin-bottom: 14px;
      border-radius: 6px;
      border: 1px solid #333;
      background: #090a0c;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    .rsvp-form input:focus, .rsvp-form select:focus {
      border-color: var(--secondary-accent);
    }

    .rsvp-form button {
      font-family: 'Impact', 'Segoe UI', sans-serif;
      background: linear-gradient(180deg, #e22828 0%, #a81212 100%);
      color: #fff;
      font-size: 1.2rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      transform: skew(-5deg);
      box-shadow: 0 4px 0px #610b0b;
    }

    .rsvp-form button:hover {
      background: linear-gradient(180deg, #ff3333 0%, #c41414 100%);
      box-shadow: 0 2px 0px #610b0b;
      transform: skew(-5deg) translateY(2px);
    }

    #confirmation {
      display: none;
      font-family: 'Impact', sans-serif;
      font-size: 1.3rem;
      margin-top: 15px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .attending-msg {
      color: #2ecc71; /* Green */
    }

    .declined-msg {
      color: #f39c12; /* Orange / Gold */
    }
  </style>
</head>
<body>

  <div class="invite-card">
    <span class="badge">🏆 BORN CHAMPION • HOLY BAPTISM</span>
    <h1>OUR LITTLE CHAMPION</h1>
    <p class="subtitle">Join us as we celebrate the first major milestone and blessing of our Little Racing Champion!</p>

    <div class="event-details">
      <div class="detail-item"><strong>Date:</strong> Setyembre 30, 2026</div>
      <div class="detail-item"><strong>Baptism Ceremony:</strong> 10:00 AM</div>
      <div class="detail-item"><strong>Victory Party (Paddock):</strong> Grand Ballroom</div>
    </div>

    <!-- RSVP Form Component -->
    <form class="rsvp-form" id="rsvpForm">
      <input type="text" id="name" name="name" placeholder="Guest / Pit Crew Full Name" required>
      <select id="attendance" name="attendance" required>
        <option value="" disabled selected>Will you join the victory lap?</option>
        <option value="Yes, I will be there!">🏁 YES! Count me in for the celebration</option>
        <option value="Sorry, I can't make it">❌ NO - Out of the Pit Lane</option>
      </select>
      <button type="submit" id="submitBtn">CLAIM VIP CHAMPION PASS 🏎️</button>
    </form>

    <!-- Success Message Container -->
    <div id="confirmation"></div>
  </div>

  <script>
    /**
     * Service Layer - Background Data Dispatcher
     */
    class RsvpService {
      constructor(scriptUrl) {
        this.scriptUrl = scriptUrl;
      }

      sendResponse(data) {
        const formData = new URLSearchParams();
        formData.append('name', data.name);
        formData.append('attendance', data.attendance);

        // Instant background fetch without blocking UI thread
        return fetch(this.scriptUrl, {
          method: 'POST',
          mode: 'no-cors',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded'
          },
          body: formData.toString()
        });
      }
    }

    /**
     * UI Layer - Instant Renderer
     */
    class RsvpFormUI {
      constructor() {
        this.formElement = document.getElementById('rsvpForm');
        this.nameInput = document.getElementById('name');
        this.attendanceSelect = document.getElementById('attendance');
        this.confirmationMessage = document.getElementById('confirmation');
      }

      getFormData() {
        return {
          name: this.nameInput.value,
          attendance: this.attendanceSelect.value
        };
      }

      showSuccessState(attendanceValue) {
        // Tago agad ang form instantly
        this.formElement.style.display = 'none';

        if (attendanceValue.includes("Yes")) {
          this.confirmationMessage.className = 'attending-msg';
          this.confirmationMessage.innerHTML = '🏁 VIP CHAMPION PASS CONFIRMED! SEE YOU THERE! 🎉';
        } else {
          this.confirmationMessage.className = 'declined-msg';
          this.confirmationMessage.innerHTML = '🏁 WE\'LL MISS YOU AT THE RACE! THANK YOU FOR LETTING US KNOW! 🙏';
        }

        this.confirmationMessage.style.display = 'block';
      }
    }

    /**
     * Controller Layer - Instant Event Handler
     */
    class RsvpApp {
      constructor(service, ui) {
        this.service = service;
        this.ui = ui;
      }

      init() {
        this.ui.formElement.addEventListener('submit', (e) => this.handleSubmit(e));
      }

      handleSubmit(e) {
        e.preventDefault();
        
        const formData = this.ui.getFormData();

        // 1. INSTANT UX: Ipakita agad sa guest ang success message na walang loading delay
        this.ui.showSuccessState(formData.attendance);

        // 2. BACKGROUND FIRE-AND-FORGET: I-send ang payload sa Google Script nang hindi pinaghihintay ang browser
        this.service.sendResponse(formData).catch(err => console.error('Background dispatch error:', err));
      }
    }

    // Entry Point Initialization
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzWet9ZV7nCGUq8_Y4AMakd-rQx5leV5PVIT54s7QuOd0nDMcgCZp3zezEwmRloLxF9/exec';

    const rsvpService = new RsvpService(SCRIPT_URL);
    const rsvpUI = new RsvpFormUI();

    const app = new RsvpApp(rsvpService, rsvpUI);
    app.init();
  </script>
</body>
</html>
