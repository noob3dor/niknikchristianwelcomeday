<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Niknik's Christian Welcome Day & 1st Birthday</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --racing-red: #e10600;
      --racing-dark: #15151e;
      --racing-card: #1f1f2d;
      --text-light: #ffffff;
      --text-gray: #a0a0b0;
      --accent-yellow: #fff000;
      --success-green: #00e676;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--racing-dark);
      color: var(--text-light);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--racing-card);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 2px solid var(--racing-red);
      width: 100%;
      max-width: 480px;
      padding: 30px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .header-tag {
      background-color: var(--racing-red);
      color: var(--text-light);
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      padding: 6px 16px;
      border-radius: 20px;
      display: inline-block;
      margin-bottom: 15px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.6rem;
      margin-bottom: 10px;
      color: var(--text-light);
      text-transform: uppercase;
    }

    p.subtitle {
      color: var(--text-gray);
      font-size: 0.95rem;
      margin-bottom: 25px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-gray);
      margin-bottom: 8px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid #333345;
      background-color: #15151e;
      color: var(--text-light);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.3s;
    }

    input[type="text"]:focus {
      border-color: var(--racing-red);
    }

    .radio-group {
      display: flex;
      gap: 15px;
    }

    .radio-btn {
      flex: 1;
      position: relative;
    }

    .radio-btn input {
      position: absolute;
      opacity: 0;
      cursor: pointer;
    }

    .radio-label {
      display: block;
      padding: 12px;
      text-align: center;
      background-color: #15151e;
      border: 1px solid #333345;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
    }

    .radio-btn input:checked + .radio-label {
      border-color: var(--racing-red);
      background-color: rgba(225, 6, 0, 0.15);
      color: var(--accent-yellow);
    }

    .submit-btn {
      width: 100%;
      background-color: var(--racing-red);
      color: var(--text-light);
      font-family: 'Orbitron', sans-serif;
      font-size: 1rem;
      font-weight: 800;
      padding: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: transform 0.1s, background-color 0.3s;
    }

    .submit-btn:hover {
      background-color: #ff1a15;
    }

    .submit-btn:active {
      transform: scale(0.98);
    }

    .message-box {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      font-size: 0.95rem;
      display: none;
      font-weight: 600;
      line-height: 1.4;
    }

    .message-box.yes {
      background-color: rgba(0, 230, 118, 0.15);
      border: 1px solid var(--success-green);
      color: var(--success-green);
    }

    .message-box.no {
      background-color: rgba(255, 240, 0, 0.15);
      border: 1px solid var(--accent-yellow);
      color: var(--accent-yellow);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-tag">Paddock Pass RSVP</div>
    <h1>Niknik's 1st Birthday</h1>
    <p class="subtitle">Christian Welcome Day & Racing Party</p>

    <form id="rsvpForm">
      <div class="form-group">
        <label for="guestName">Guest Name / Family Name</label>
        <input type="text" id="guestName" placeholder="Enter your full name" required>
      </div>

      <div class="form-group">
        <label>Will you join the race?</label>
        <div class="radio-group">
          <div class="radio-btn">
            <input type="radio" id="attendYes" name="attendance" value="Yes" checked>
            <label for="attendYes" class="radio-label">YES 🏎️</label>
          </div>
          <div class="radio-btn">
            <input type="radio" id="attendNo" name="attendance" value="No">
            <label for="attendNo" class="radio-label">NO 🏁</label>
          </div>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">CLAIM VIP CHAMPION PASS 🏎️</button>
    </form>

    <div id="messageBox" class="message-box"></div>
  </div>

  <script>
    /**
     * Service Layer - Handles API communication with Google Apps Script
     */
    class RsvpService {
      constructor(scriptUrl) {
        this.scriptUrl = scriptUrl;
      }

      sendResponse(data) {
        // Fire-and-forget strategy using no-cors mode
        return fetch(this.scriptUrl, {
          method: 'POST',
          mode: 'no-cors',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(data)
        });
      }
    }

    /**
     * UI Layer - Handles DOM operations and rendering
     */
    class RsvpUI {
      constructor() {
        this.formElement = document.getElementById('rsvpForm');
        this.nameInput = document.getElementById('guestName');
        this.submitBtn = document.getElementById('submitBtn');
        this.messageBox = document.getElementById('messageBox');
      }

      getFormData() {
        const attendanceValue = document.querySelector('input[name="attendance"]:checked').value;
        return {
          name: this.nameInput.value.trim(),
          attendance: attendanceValue
        };
      }

      showSuccessState(attendance) {
        // Hide form immediately for fast UX
        this.formElement.style.display = 'none';

        if (attendance === 'Yes') {
          this.messageBox.className = 'message-box yes';
          this.messageBox.innerHTML = '🏁 VIP CHAMPION PASS CONFIRMED!<br>See you at the starting line! 🎉';
        } else {
          this.messageBox.className = 'message-box no';
          this.messageBox.innerHTML = "🏁 WE'LL MISS YOU AT THE RACE!<br>Thank you for letting us know! 🙏";
        }

        this.messageBox.style.display = 'block';
      }
    }

    /**
     * Controller Layer - Application Orchestrator (Optimized for Instant Speed)
     */
    class RsvpApp {
      constructor(service, ui) {
        this.service = service;
        this.ui = ui;
      }

      init() {
        this.ui.formElement.addEventListener('submit', (e) => this.handleSubmit(e));
      }

      handleSubmit(e) {
        e.preventDefault();
        
        const formData = this.ui.getFormData();

        if (!formData.name) return;

        // 1. INSTANT FEEDBACK: Ipakita agad ang prompt sa bisita nang walang anumang delay
        this.ui.showSuccessState(formData.attendance);

        // 2. BACKGROUND SUBMISSION: Ipadala sa Google Sheet nang hindi pinaghihintay ang bisita
        this.service.sendResponse(formData).catch(err => {
          console.error('Background Sync Error:', err);
        });
      }
    }

    // Application Initialization
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxe7zK6pM80TToa25uRj5Y-u1Aia4Qz_Y7k8-f7i4sIeX89L6g2EaY_5j2yY8Z5/exec';
    
    document.addEventListener('DOMContentLoaded', () => {
      const service = new RsvpService(SCRIPT_URL);
      const ui = new RsvpUI();
      const app = new RsvpApp(service, ui);
      app.init();
    });
  </script>
</body>
</html>
